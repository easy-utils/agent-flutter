name: agent_app
description: "Easy Agent chat client (agent.v1.AgentService via easy-rpc)."
publish_to: 'none'
version: 0.1.86+86

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_markdown_plus: ^1.0.0
  collection: ^1.19.1
  path_provider: ^2.1.6
  file_picker: ^12.1.3
  http_parser: ^4.1.2
  image_picker: ^1.2.3
  intl: any
  re_highlight: ^0.0.3
  agent_client_sdk:
    git:
      url: https://github.com/easy-utils/agent-sdk-dart.git
      ref: v0.16.1
  easy_rpc:
    git:
      url: https://github.com/easy-utils/easy-rpc-dart.git
      ref: v3.0.1
  protobuf: ^6.1.0
  http2: ^2.3.0
  record: ^7.1.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  # Audio/video playback. These are the Flutter-team/community plugins with
  # FIRST-CLASS Swift Package Manager support on macOS/iOS, which keeps the
  # darwin build entirely CocoaPods-free (media_kit's macOS video packages are
  # podspec-only, forcing `pod install`).
  video_player: ^2.11.1
  just_audio: ^0.10.6
  web: ^1.1.1
  # Clipboard image/file paste (desktop + Android) and file drag-and-drop
  # (all platforms). Attachment naming uses uuid v4.
  pasteboard: ^0.5.0
  desktop_drop: ^0.8.4
  uuid: ^4.6.0
  # Unified icon set shared with the Compose / WebUI / SwiftUI clients
  # (see tools/icons.py for the cross-client slot table). Icon fonts are
  # tree-shaken by the Flutter tool in release builds, so only the ~130 used
  # glyphs ship.
  flutter_lucide: ^1.46.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/certs/
  # Bundled so the app renders CJK/latin consistently on systems with no
  # fonts installed (e.g. minimal Linux desktop / container). The faces are
  # STATIC Regular/SemiBold instances of the Noto Sans SC variable font,
  # generated by tools/gen-fonts.py: the variable source defaulted to Thin(100)
  # and the four clients' engines select variable instances differently, so
  # instancing keeps every client's rasterization identical.
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-SemiBold.ttf
          weight: 600
    # Monospace for code / paths / diffs, shared with the other clients (the
    # platform `monospace` fallback differed per OS and bundled no CJK).
    - family: NotoSansMono
      fonts:
        - asset: assets/fonts/NotoSansMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansMono-SemiBold.ttf
          weight: 600
    # Bundled emoji font (CBDT color): on the web there is no system font to
    # fall back to, and the engine's remote fallback service is deliberately
    # disabled (no gstatic dependency), so emoji must ship with the app.
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
